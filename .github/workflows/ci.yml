name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security:
    name: Sensitive Data & Secret Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for forbidden sensitive files
        run: |
          forbidden_files=$(git ls-files | grep -E '(\.env(\..+)?$|^data/|.*\.db$|.*\.db-(shm|wal)$|.*\.sqlite3?$|.*\.key$|.*\.pem$|.*\.crt$|.*\.p12$|.*id_rsa|.*id_ed25519|.*\.epub$|.*\.cbz$|.*\.cbr$)' | grep -v -E '^(\.env\.example|\.env\.template)$' || true)
          if [ -n "$forbidden_files" ]; then
            echo "❌ Sensitive or data files found tracked in repository:"
            echo "$forbidden_files"
            exit 1
          fi
          echo "✅ No tracked sensitive files detected."

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Pytest
        run: uv run pytest
