services:
  aarkib:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarkib
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - AARKIB_DATA_DIR=/app/data
      - AARKIB_AUTH_REQUIRED=true
      - AARKIB_ALLOW_REGISTRATION=true
      - AARKIB_AUTO_SCAN=true
      - AARKIB_WATCH_LIBRARY=true
      - AARKIB_AUTO_ENRICH=false
      - AARKIB_METADATA_PROVIDER=all
      - AARKIB_PAGE_SIZE=24
      - SECRET_KEY=${SECRET_KEY:-aarkib-production-secret-key-change-me}
