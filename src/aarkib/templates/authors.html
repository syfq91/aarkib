{% extends "base.html" %}
{% block title %}Authors - Aarkib{% endblock %}

{% block content %}
<h2 style="margin-bottom: 1.5rem;">Authors</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem;">
  {% for author in authors %}
    <a href="/?author_id={{ author.id }}" class="book-card" style="padding: 1.25rem; text-decoration: none;">
      <div style="font-weight: 600; font-size: 1.05rem; margin-bottom: 0.25rem;">{{ author.name }}</div>
      <div style="font-size: 0.85rem; color: var(--text-secondary);">{{ author.books|length }} book(s)</div>
    </a>
  {% endfor %}
</div>
{% endblock %}
