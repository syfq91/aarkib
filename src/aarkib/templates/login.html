{% extends "base.html" %}
{% block title %}Sign In - Aarkib{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto; background-color: var(--bg-secondary); padding: 2.25rem; border-radius: var(--radius-xl); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card);">
  <h2 style="margin-bottom: 0.5rem; text-align: center;">Sign In to Aarkib</h2>
  <p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem;">
    Access your library, sync reading progress, and manage bookmarks.
  </p>

  <form method="POST" action="/auth/login" style="display: flex; flex-direction: column; gap: 1rem;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="login-username" style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Username</label>
      <input type="text" id="login-username" name="username" class="input-text" required autofocus placeholder="Enter your username" style="width: 100%;">
    </div>
    <div>
      <label for="login-password" style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">
        Password <span style="font-size: 0.75rem; color: var(--text-secondary);">(leave blank if passwordless)</span>
      </label>
      <input type="password" id="login-password" name="password" class="input-text" placeholder="•••••••• (leave blank if passwordless)" style="width: 100%;">
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
        <input type="checkbox" name="remember" id="remember" checked>
        <span>Remember me</span>
      </label>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.65rem;">Sign In</button>
  </form>
</div>
{% endblock %}
