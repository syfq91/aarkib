{% extends "base.html" %}
{% block title %}Sign In - Buukuu{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto; background-color: var(--bg-secondary); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
  <h2 style="margin-bottom: 0.5rem; text-align: center;">Sign In to Buukuu</h2>
  <p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem;">
    Access your library, sync reading progress, and manage bookmarks.
  </p>

  <form method="POST" action="/auth/login" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Username</label>
      <input type="text" name="username" class="input-text" required autofocus placeholder="Enter your username">
    </div>
    <div>
      <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Password</label>
      <input type="password" name="password" class="input-text" required placeholder="••••••••">
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem;">
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
        <input type="checkbox" name="remember" id="remember" checked>
        <span>Remember me</span>
      </label>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.65rem;">Sign In</button>
  </form>

  {% if allow_registration %}
  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 1rem;">
    Don't have an account? <a href="/auth/register" style="color: var(--accent); text-decoration: none; font-weight: 500;">Create one</a>
  </div>
  {% endif %}
</div>
{% endblock %}
