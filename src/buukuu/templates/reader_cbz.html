<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ book.title }} - Buukuu Comic Reader</title>
  
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/reader-cbz.css">
  <script>
    window.BOOK_ID = {{ book.id }};
    window.INITIAL_PAGE = {{ initial_page }};
  </script>
</head>
<body class="cbz-reader-body" data-book-id="{{ book.id }}" data-initial-page="{{ initial_page }}">

  <!-- Header -->
  <header id="cbz-header" class="cbz-header">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="/book/{{ book.id }}" style="color: #f8fafc; text-decoration: none; font-size: 1.1rem;" title="Exit">←</a>
      <span style="font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 35vw;">
        {{ book.title }}
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
      <select id="spread-select" class="select-input" style="padding: 0.35rem 0.5rem; font-size: 0.85rem; width: auto;" title="Page Mode">
        <option value="single">Single Page</option>
        <option value="double">Double Page</option>
        <option value="webtoon">Continuous (Webtoon)</option>
      </select>
      <select id="webtoon-width-select" class="select-input" style="padding: 0.35rem 0.5rem; font-size: 0.85rem; width: auto; display: none;" title="Webtoon Width">
        <option value="compact">Compact (600px)</option>
        <option value="medium" selected>Medium (800px)</option>
        <option value="large">Large (1000px)</option>
        <option value="full">Full Width (100%)</option>
      </select>
      <select id="direction-select" class="select-input" style="padding: 0.35rem 0.5rem; font-size: 0.85rem; width: auto;" title="Reading Direction">
        <option value="ltr">Left to Right (LTR)</option>
        <option value="rtl">Right to Left (RTL)</option>
      </select>
      <button id="fullscreen-btn" class="btn btn-icon" title="Fullscreen">⛶</button>
    </div>
  </header>

  <!-- Viewport -->
  <div id="cbz-viewport" class="cbz-viewport">
    <div id="cbz-canvas-container" class="cbz-canvas-container">
      <div id="cbz-loading-state" class="cbz-loading-state">
        <div class="spinner"></div>
        <div id="cbz-loading-msg">Opening comic...</div>
      </div>
    </div>
  </div>

  <!-- Touch Nav Zones (for Single / Double page modes) -->
  <div id="touch-prev" class="cbz-touch-prev"></div>
  <div id="touch-menu" class="cbz-touch-menu"></div>
  <div id="touch-next" class="cbz-touch-next"></div>

  <!-- Footer Controls -->
  <footer id="cbz-footer" class="cbz-footer">
    <div id="page-indicator" class="footer-left" style="min-width: 60px; text-align: left; font-size: 0.85rem; color: #94a3b8;">
      {{ initial_page }} / ?
    </div>
    
    <input type="range" id="page-slider" class="page-slider" min="1" max="1" value="{{ initial_page }}">
    
    <div id="progress-percent" class="footer-right" style="min-width: 50px; text-align: right; font-size: 0.85rem; color: #94a3b8;">
      0%
    </div>
  </footer>

  <script>
    const BOOK_ID = {{ book.id }};
    const INITIAL_PAGE = {{ initial_page }};
  </script>
  <script src="/static/js/reader-cbz.js"></script>
</body>
</html>
