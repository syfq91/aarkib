{% extends "base.html" %}
{% block title %}Tags - Buukuu{% endblock %}

{% block content %}
<h2 style="margin-bottom: 1.5rem;">Categories & Tags</h2>
<div style="display: flex; flex-wrap: wrap; gap: 0.75rem;">
  {% for tag in tags %}
    <a href="/?tag_id={{ tag.id }}" class="tag-badge" style="font-size: 0.95rem; padding: 0.5rem 1rem;">
      {{ tag.name }} ({{ tag.books|length }})
    </a>
  {% endfor %}
</div>
{% endblock %}
